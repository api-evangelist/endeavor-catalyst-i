name: Endeavor Catalyst I
description: >-
  Endeavor Catalyst is the rules-based, co-investment fund of Endeavor Global, the nonprofit that
  supports high-impact entrepreneurs worldwide. The fund invests exclusively in companies led by
  Endeavor Entrepreneurs across Series A through D+ rounds, recycling proceeds back into Endeavor's
  mission of building entrepreneurial ecosystems in emerging and underserved markets. Endeavor
  Catalyst I is the first vintage in this fund family; across all vintages the program manages
  $540M+ in assets with 405+ active investments spanning 35+ markets, including 71 companies valued
  at $1B+ and 37 realized exits. This profile tracks the firm as a venture-capital entity in the
  API Evangelist network; it publishes no public API.
